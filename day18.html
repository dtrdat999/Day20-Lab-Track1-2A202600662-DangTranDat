<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiBiGo AI Trip Planner — Day18 Track1 Lab</title>
  <meta name="description" content="Human-Centered AI Design prototype for NiBiGo AI Trip Planner." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d2d44;
      --navy-2: #143a54;
      --teal: #0f5964;
      --teal-2: #0d6b76;
      --gold: #c4922f;
      --gold-2: #e9c76d;
      --cream: #f7f0e4;
      --cream-2: #fffaf0;
      --paper: #fffdf8;
      --line: #e5d9c8;
      --text: #122d42;
      --muted: #776d64;
      --green: #1f8a5b;
      --orange: #b66c13;
      --red: #bd3c32;
      --shadow: 0 18px 55px rgba(13, 45, 68, 0.12);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Lora", Georgia, serif;
      color: var(--text);
      background: var(--cream);
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 22px;
      background: var(--navy);
      color: #fff;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 34px;
    }

    .brand-mark {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 33px;
      line-height: 0.98;
      letter-spacing: -0.06em;
      color: #fff;
    }

    .brand p {
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .side-menu {
      display: grid;
      gap: 12px;
    }

    .side-item {
      width: 100%;
      min-height: 64px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.05);
      color: #f9f4ea;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: 0.18s ease;
    }

    .side-item span {
      color: var(--gold-2);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .side-item:hover,
    .side-item.active {
      background: rgba(233, 199, 109, 0.16);
      border-color: rgba(233, 199, 109, 0.65);
      transform: translateX(2px);
    }

    .sidebar-note {
      margin-top: 28px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .sidebar-note strong {
      color: #fff;
    }

    .sidebar-note p {
      margin: 8px 0 0;
    }

    .main {
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 34px clamp(24px, 4vw, 64px);
      background: rgba(247, 240, 228, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-weight: 700;
      font-size: 0.78rem;
    }

    .topbar h2 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      min-height: 48px;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 16px 32px rgba(13, 45, 68, 0.2);
    }

    .btn-ghost {
      background: var(--paper);
      color: var(--navy);
      border: 1px solid var(--line);
    }

    .flow-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 22px clamp(24px, 4vw, 64px);
      background: #f1e8d7;
      border-bottom: 1px solid var(--line);
    }

    .flow-step {
      flex: 0 0 160px;
      min-height: 82px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 12px 28px rgba(13, 45, 68, 0.05);
    }

    .flow-step span {
      display: block;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .flow-step strong {
      color: var(--navy);
      font-size: 0.92rem;
    }

    .flow-step.active {
      border-color: var(--gold);
      background: #fff8e6;
    }

    .flow-arrow {
      color: #b8a88c;
      flex: 0 0 auto;
    }

    .workspace {
      padding: clamp(24px, 4vw, 64px);
    }

    .screen-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
      gap: clamp(24px, 4vw, 48px);
      align-items: start;
    }

    .demo-card,
    .rationale-card {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .demo-card {
      padding: clamp(20px, 3vw, 34px);
      overflow: hidden;
    }

    .rationale-card {
      padding: 28px;
      position: sticky;
      top: 154px;
    }

    .rationale-card h3 {
      margin: 0 0 20px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.85rem;
    }

    .rationale-block+.rationale-block {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .rationale-block h4 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .rationale-block p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
      gap: 28px;
      align-items: stretch;
    }

    .hero-panel {
      min-height: 450px;
      padding: clamp(28px, 4vw, 52px);
      border-radius: 24px;
      background: radial-gradient(circle at 20% 0%, rgba(233, 199, 109, 0.18), transparent 34%), linear-gradient(145deg, #0d4853, #0d2d44);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-panel .label {
      color: var(--gold-2);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .hero-panel h2 {
      margin: 0;
      color: #fff;
      font-size: 45px !important;
      line-height: 1.12;
      letter-spacing: -0.03em;
      max-width: 720px;
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
    }

    .hero-panel p {
      color: rgba(255, 255, 255, 0.82);
      margin: 22px 0 0;
      font-size: clamp(1rem, 1.35vw, 1.2rem);
      line-height: 1.7;
    }

    .capability-list {
      display: grid;
      gap: 16px;
    }

    .capability {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 16px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
    }

    .icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .icon.good {
      background: #e5f7ec;
      color: var(--green);
    }

    .icon.warn {
      background: #fff3d5;
      color: var(--orange);
    }

    .icon.stop {
      background: #ffe8e6;
      color: var(--red);
    }

    .capability h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .capability p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 14px 16px;
      color: var(--text);
      outline: none;
    }

    .field textarea {
      min-height: 108px;
      resize: vertical;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: clamp(1.55rem, 3vw, 2.3rem);
      letter-spacing: -0.04em;
    }

    .section-desc {
      margin: -8px 0 28px;
      color: var(--muted);
      line-height: 1.75;
      max-width: 780px;
    }

    .timeline {
      display: grid;
      gap: 14px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .timeline-time {
      font-weight: 700;
      color: var(--gold);
    }

    .timeline-item h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .timeline-item p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f4ead6;
      color: var(--navy);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .evidence-grid,
    .choice-grid,
    .feedback-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .info-box {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }

    .info-box h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .info-box p,
    .info-box li {
      color: var(--muted);
      line-height: 1.65;
    }

    .info-box ul {
      margin: 0;
      padding-left: 18px;
    }

    .choice,
    .feedback-option {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      transition: 0.16s ease;
    }

    .choice:hover,
    .feedback-option:hover,
    .choice.selected,
    .feedback-option.selected {
      border-color: var(--gold);
      background: #fff8e6;
      transform: translateY(-2px);
    }

    .choice strong,
    .feedback-option strong {
      display: block;
      margin-bottom: 8px;
    }

    .choice span,
    .feedback-option span {
      color: var(--muted);
      line-height: 1.55;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .compare-card {
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .compare-card.after {
      border-color: rgba(31, 138, 91, 0.45);
      background: #f1fbf5;
    }

    .compare-card h3 {
      margin: 0 0 14px;
    }

    .compare-card ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.75;
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 18px;
      background: #fff4d7;
      border: 1px solid #f1d690;
      color: #71460d;
      line-height: 1.65;
    }

    .notice.danger {
      background: #ffe9e7;
      border-color: #f2b3ad;
      color: #7f241d;
    }

    .notice.success {
      background: #e9f9ef;
      border-color: #afe0c2;
      color: #195c3d;
    }

    .status-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 0;
    }

    .status-pill {
      padding: 10px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 0.86rem;
    }

    .status-pill.act {
      color: var(--green);
    }

    .status-pill.ask {
      color: var(--orange);
    }

    .status-pill.stop {
      color: var(--red);
    }

    .footer-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    .mobile-menu,
    .backdrop {
      display: none;
    }

    @media (max-width: 1180px) {
      .app-shell {
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .sidebar {
        padding: 24px 18px;
      }

      .screen-grid {
        grid-template-columns: 1fr;
      }

      .rationale-card {
        position: static;
      }
    }

    @media (max-width: 920px) {

      .hero-layout,
      .form-grid,
      .evidence-grid,
      .choice-grid,
      .feedback-grid,
      .compare-grid {
        grid-template-columns: 1fr;
      }

      .timeline-item {
        grid-template-columns: 1fr;
      }

      .timeline-item .tag {
        width: fit-content;
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 100;
        width: min(84vw, 330px);
        height: 100vh;
        transform: translateX(-105%);
        transition: transform 0.25s ease;
        box-shadow: 24px 0 60px rgba(0, 0, 0, 0.3);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(0, 0, 0, 0.45);
      }

      .backdrop.open {
        display: block;
      }

      .mobile-menu {
        display: grid;
        place-items: center;
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 110;
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-size: 1.5rem;
        box-shadow: 0 18px 40px rgba(13, 45, 68, 0.25);
      }

      .topbar {
        padding: 22px 18px;
      }

      .top-actions {
        width: 100%;
      }

      .btn {
        flex: 1;
      }

      .flow-strip {
        padding: 16px 18px;
      }

      .workspace {
        padding: 20px 16px 88px;
      }

      .demo-card,
      .rationale-card {
        border-radius: 22px;
      }

      .hero-panel {
        min-height: auto;
      }

      .hero-panel h2 {
        font-size: 45px !important;
      }
    }


    /* =========================
   FINAL CLEAN PATCH & DAY 20 PREMIUM STYLES
   - keep full-width layout stable
   - hero h2 fixed 45px
   - input footer buttons responsive
   - custom worksheets styling (canvas, hook, ladder, tables)
   ========================= */
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body,
    button,
    input,
    select,
    textarea,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    span,
    div,
    a,
    li {
      font-family: "Lora", Georgia, serif !important;
    }

    .top-mode-switcher {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--navy);
      padding: 14px 28px;
      border-bottom: 3px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(13, 45, 68, 0.18);
    }

    .switcher-brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .switcher-brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold-2), var(--gold));
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .switcher-brand-text {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .switcher-brand-text span {
      color: var(--gold-2);
      font-weight: 400;
      font-size: 0.9rem;
      margin-left: 8px;
    }

    .switcher-buttons {
      display: flex;
      gap: 12px;
    }

    .switch-btn {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .switch-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      transform: translateY(-1px);
    }

    .switch-btn.active {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(196, 146, 47, 0.25);
    }

    .app-shell {
      width: 100%;
      max-width: 100vw;
      grid-template-columns: clamp(260px, 20vw, 320px) minmax(0, 1fr) !important;
      overflow-x: hidden;
      min-height: calc(100vh - 66px);
      display: grid;
    }

    .main,
    .workspace,
    .demo-card,
    .rationale-card,
    .hero-panel,
    .capability-list {
      min-width: 0;
      max-width: 100%;
    }

    .screen-grid {
      width: 100%;
      max-width: 100%;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px) !important;
    }

    .hero-layout {
      grid-template-columns: minmax(0, 1fr) !important;
    }

    .capability-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .hero-panel {
      min-height: 360px;
    }

    .hero-panel h2 {
      font-size: 45px !important;
      line-height: 1.12 !important;
      letter-spacing: -0.03em !important;
      max-width: 720px !important;
      white-space: normal !important;
      word-break: normal !important;
      overflow-wrap: normal !important;
      hyphens: none !important;
    }

    .footer-actions .btn {
      min-height: 52px;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
    }

    /* ==========================================
       MOBILE PHONE SIMULATOR FOR PROTOTYPE SCREENS
       ========================================== */
    .demo-card {
      width: 380px !important;
      height: 800px !important;
      background: var(--paper) !important;
      border: 12px solid #1c1c1e !important;
      border-radius: 46px !important;
      box-shadow: 0 25px 60px rgba(13, 45, 68, 0.25), 0 0 0 1px #2c2c2e !important;
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      margin: 0 auto !important;
      flex-shrink: 0 !important;
      padding: 0 !important;
    }

    /* Phone Status Bar */
    .phone-status-bar {
      height: 44px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      z-index: 10;
      border-bottom: 1px solid rgba(0,0,0,0.03);
      flex-shrink: 0;
      position: relative;
    }

    .phone-notch {
      width: 120px;
      height: 20px;

    const orderDay20 = ["onboarding_d20", "input_d20", "ask_d20", "draft_d20", "recovery_d20", "review_d20"];
    
    let activeFlow = "day20"; // default flow is Day 20
    let current = "onboarding_d20";

    const workspace = document.getElementById("workspace");
    const screenTitle = document.getElementById("screenTitle");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const sidebar = document.getElementById("sidebar");
    const mobileMenu = document.getElementById("mobileMenu");
    const backdrop = document.getElementById("backdrop");
    const flowSelect = document.getElementById("flowSelect");
    const demoPathHint = document.getElementById("demoPathHint");
    const eyebrowText = document.getElementById("eyebrowText");

    // Mode Switcher Elements
    const modePrototypeBtn = document.getElementById("modePrototypeBtn");
    const modeWorksheetsBtn = document.getElementById("modeWorksheetsBtn");
    const prototypeContainer = document.getElementById("prototypeContainer");
    const worksheetsContainer = document.getElementById("worksheetsContainer");
    const wsWorkspace = document.getElementById("wsWorkspace");
    const wsTitle = document.getElementById("wsTitle");

    // Dynamic Navigation and Flow Strip Builder
    function rebuildNavigation() {
      const sideMenu = document.getElementById("sideMenu");
      const flowStrip = document.querySelector(".flow-strip");
      
      if (activeFlow === "day20") {
        eyebrowText.textContent = "Prototype · Day 20 Redesigned Onboarding Flow";
        demoPathHint.textContent = "Onboarding → Quick Input → Choose Transport → Draft (with inline warning/panel) → Recovery Comparison → Review & Save.";
        
        sideMenu.innerHTML = `
          <button class="side-item" data-screen="onboarding_d20"><span>01</span>Onboarding (D20)</button>
          <button class="side-item" data-screen="input_d20"><span>02</span>Quick Input</button>
          <button class="side-item" data-screen="ask_d20"><span>03</span>Ask: Transport</button>
          <button class="side-item" data-screen="draft_d20"><span>04</span>AI Draft (D20)</button>
          <button class="side-item" data-screen="recovery_d20"><span>05</span>Recovery (D20)</button>
          <button class="side-item" data-screen="review_d20"><span>06</span>Final Review & Save</button>
        `;
        
        flowStrip.innerHTML = `
          <div class="flow-step" data-screen="onboarding_d20"><span>Start</span><strong>Onboarding</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="input_d20"><span>Input</span><strong>Quick Needs</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="ask_d20"><span>Ask</span><strong>Transport</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="draft_d20"><span>Act</span><strong>AI Draft</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="recovery_d20"><span>Recover</span><strong>Adjusted</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="review_d20"><span>End</span><strong>Save & Review</strong></div>
        `;
      } else {
        eyebrowText.textContent = "Prototype · Day 18 Original Flow";
        demoPathHint.textContent = "Start → Input → Draft → Evidence → Ask → Recovery → Uncertainty → Feedback → Review.";
        
        sideMenu.innerHTML = `
          <button class="side-item" data-screen="onboarding"><span>01</span>Onboarding</button>
          <button class="side-item" data-screen="input"><span>02</span>Trip Input</button>
          <button class="side-item" data-screen="draft"><span>03</span>AI Draft</button>
          <button class="side-item" data-screen="evidence"><span>04</span>Evidence</button>
          <button class="side-item" data-screen="ask"><span>05</span>Ask State</button>
          <button class="side-item" data-screen="recovery"><span>06</span>Recovery</button>
          <button class="side-item" data-screen="uncertainty"><span>07</span>Uncertainty</button>
          <button class="side-item" data-screen="feedback"><span>08</span>Feedback</button>
          <button class="side-item" data-screen="review"><span>09</span>Final Review</button>
        `;
        
        flowStrip.innerHTML = `
          <div class="flow-step" data-screen="onboarding"><span>Start</span><strong>Onboarding</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="input"><span>Input</span><strong>Trip Needs</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="draft"><span>Act</span><strong>AI Draft</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="ask"><span>Ask</span><strong>Transport</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="recovery"><span>Recover</span><strong>Too Intense</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="uncertainty"><span>Don't Act</span><strong>Uncertain Data</strong></div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-screen="review"><span>End</span><strong>Review</strong></div>
        `;
      }
      
      // Hook up listeners
      const sideItems = [...sideMenu.querySelectorAll(".side-item")];
      const flowSteps = [...flowStrip.querySelectorAll(".flow-step")];
      
      sideItems.forEach(item => {
        item.addEventListener("click", () => render(item.dataset.screen));
      });
      
      flowSteps.forEach(item => {
        item.addEventListener("click", () => render(item.dataset.screen));
      });
    }

    function render(screenId) {
      const activeScreens = activeFlow === "day20" ? screensDay20 : screensDay18;
      const screen = activeScreens[screenId] || activeScreens[activeFlow === "day20" ? "onboarding_d20" : "onboarding"];
      current = screenId;
      screenTitle.textContent = screen.title;
      nextBtn.textContent = screen.cta || "Next";
      workspace.innerHTML = screen.html;

      // Wrap .demo-card content inside a mobile phone simulator frame
      const demoCard = workspace.querySelector(".demo-card");
      if (demoCard) {
        const originalContent = demoCard.innerHTML;
        demoCard.innerHTML = `
          <!-- Phone Status Bar -->
          <div class="phone-status-bar">
            <span class="phone-time">09:41</span>
            <div class="phone-notch"></div>
            <div class="phone-icons">
              <span class="phone-icon-signal">📶</span>
              <span class="phone-icon-wifi">📶</span>
              <span class="phone-icon-battery">🔋</span>
            </div>
          </div>
          <!-- Phone Scrollable Content -->
          <div class="phone-body">
            ${originalContent}
          </div>
          <!-- Phone Home Indicator -->
          <div class="phone-home-indicator-bar">
            <div class="phone-home-indicator"></div>
          </div>
        `;
      }

      // Update sidebar active classes
      const sideItems = [...document.querySelectorAll("#sideMenu .side-item")];
      const flowSteps = [...document.querySelectorAll(".flow-strip .flow-step")];
      sideItems.forEach(item => item.classList.toggle("active", item.dataset.screen === screenId));
      flowSteps.forEach(item => item.classList.toggle("active", item.dataset.screen === screenId));

      // Hook data-goto navigation buttons inside workspace
      workspace.querySelectorAll("[data-goto]").forEach(btn => {
        btn.addEventListener("click", () => render(btn.dataset.goto));
      });

      // Hook choice / feedback items selects
      workspace.querySelectorAll(".choice, .feedback-option").forEach(btn => {
        btn.addEventListener("click", () => {
          const group = btn.parentElement.querySelectorAll(".choice, .feedback-option");
          group.forEach(x => x.classList.remove("selected"));
          btn.classList.add("selected");
        });
      });

      // Day 20 specific interactive scripts
      if (screenId === "draft_d20") {
        const toggleEvidenceBtn = document.getElementById("toggleEvidenceBtn");
        const detailedEvidencePanel = document.getElementById("detailedEvidencePanel");
        if (toggleEvidenceBtn && detailedEvidencePanel) {
          toggleEvidenceBtn.addEventListener("click", (e) => {
            e.preventDefault();
            if (detailedEvidencePanel.style.display === "none") {
              detailedEvidencePanel.style.display = "block";
              toggleEvidenceBtn.textContent = "Thu gọn giả định ↑";
            } else {
              detailedEvidencePanel.style.display = "none";
              toggleEvidenceBtn.textContent = "Xem chi tiết & kiểm soát →";
            }
          });
        }
      }

      if (screenId === "review_d20") {
        const btnSave = document.getElementById("btnSaveItineraryD20");
        const btnShare = document.getElementById("btnShareItineraryD20");
        const btnContact = document.getElementById("btnContactHumanD20");

        if (btnSave) {
          btnSave.addEventListener("click", () => {
            alert("🎉 [CORE ACTION ĐÃ KÍCH HOẠT]\nLịch trình đã lưu thành công vào thiết bị của bạn! Sự kiện này được gửi lên hệ thống đo lường và đóng góp trực tiếp vào chỉ số North Star Metric.");
          });
        }
        if (btnShare) {
          btnShare.addEventListener("click", () => {
            alert("📤 [INVESTMENT SIGNAL]\nĐã tạo liên kết chia sẻ lịch trình Ninh Bình 1 ngày của bạn.");
          });
        }
        if (btnContact) {
          btnContact.addEventListener("click", () => {
            alert("📞 [ASK -> HUMAN HANDOFF]\nYêu cầu của bạn đã được chuyển đến hướng dẫn viên tại Ninh Bình. Họ sẽ liên hệ lại với bạn trong 10 phút.");
          });
        }
      }

      closeMenu();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function nextScreen() {
      const currentOrder = activeFlow === "day20" ? orderDay20 : orderDay18;
      const currentIndex = currentOrder.indexOf(current);
      if (currentIndex !== -1) {
        render(currentOrder[(currentIndex + 1) % currentOrder.length]);
      }
    }

    function resetDemo() {
      render(activeFlow === "day20" ? "onboarding_d20" : "onboarding");
    }

    // Worksheet render engine
    function renderWorksheet(wsId) {
      const wsMenu = document.getElementById("wsMenu");
      const wsItems = [...wsMenu.querySelectorAll(".side-item")];
      wsItems.forEach(item => item.classList.toggle("active", item.dataset.ws === wsId));

      const titleMap = {
        canvas: "01 — Customer Retention Canvas",
        core: "02 — Core Action & Active User",
        frequency: "03 — Natural Frequency & Retention Metric",
        audit: "04 — Onboarding Audit Table",
        redesign: "05 — Redesigned Onboarding Flow",
        comparison: "06 — Before / After Quantitative Comparison",
        ladder: "07 — Measurement Ladder Structure",
        northstar: "08 — North Star Metric & Trade-offs",
        nurture: "09 — Nature vs Nurture Strategy",
        hook: "10 — Hook Model Quadrants",
        tracking: "11 — Metric Tracking Requirement Spec",
        demopath: "12 — Demo Path 8-Minute Script"
      };

      wsTitle.textContent = titleMap[wsId] || "Worksheet";
      wsWorkspace.innerHTML = worksheets[wsId] || "Loading content...";
      
      closeMenu();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Toggle Console Modes
    modePrototypeBtn.addEventListener("click", () => {
      modePrototypeBtn.classList.add("active");
      modeWorksheetsBtn.classList.remove("active");
      prototypeContainer.style.display = "grid";
      worksheetsContainer.style.display = "none";
      resetDemo();
    });

    modeWorksheetsBtn.addEventListener("click", () => {
      modePrototypeBtn.classList.remove("active");
      modeWorksheetsBtn.classList.add("active");
      prototypeContainer.style.display = "none";
      worksheetsContainer.style.display = "grid";
      renderWorksheet("canvas");
    });

    // Flow selector dropdown listener
    flowSelect.addEventListener("change", (e) => {
      activeFlow = e.target.value;
      rebuildNavigation();
      resetDemo();
    });

    // Worksheet sidebar buttons listeners
    const wsMenu = document.getElementById("wsMenu");
    wsMenu.querySelectorAll(".side-item").forEach(btn => {
      btn.addEventListener("click", () => {
        renderWorksheet(btn.dataset.ws);
      });
    });

    // Mobile navigation menu handling
    function openMenu() {
      const activeSidebar = worksheetsContainer.style.display === "none" ? sidebar : document.getElementById("wsSidebar");
      activeSidebar.classList.add("open");
      backdrop.classList.add("open");
      mobileMenu.textContent = "×";
    }

    function closeMenu() {
      sidebar.classList.remove("open");
      document.getElementById("wsSidebar").classList.remove("open");
      backdrop.classList.remove("open");
      mobileMenu.textContent = "☰";
    }

    nextBtn.addEventListener("click", nextScreen);
    resetBtn.addEventListener("click", resetDemo);
    mobileMenu.addEventListener("click", () => {
      const activeSidebar = worksheetsContainer.style.display === "none" ? sidebar : document.getElementById("wsSidebar");
      activeSidebar.classList.contains("open") ? closeMenu() : openMenu();
    });
    backdrop.addEventListener("click", closeMenu);
    window.addEventListener("resize", () => { if (window.innerWidth > 760) closeMenu(); });

    // Initialize Page
    activeFlow = "day20";
    rebuildNavigation();
    render("onboarding_d20");

  </script>
</body>

</html>
